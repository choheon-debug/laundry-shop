<style>
:root{
  --bg:#EAEAEA; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --teal:#14b8a6; --teal-d:#0f766e; --blue:#3b82f6; --orange:#f97316; --purple:#a855f7; --green:#22c55e; --red:#ef4444;
  --shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -2px rgb(0 0 0 / .05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:36rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 100px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
header{text-align:center;position:relative;padding:4px 46px}
header h1{margin:0;font-size:1.5rem;font-weight:800}
header p{margin:3px 0 0;font-size:.84rem;color:var(--muted)}
.gear{position:absolute;right:0;top:2px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .08);font-size:1.15rem}
.back{position:absolute;left:0;top:2px;height:42px;border:0;border-radius:21px;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .08);padding:0 12px;font-weight:800;font-size:.9rem}
.card{background:var(--card);border-radius:1.5rem;box-shadow:var(--shadow);padding:16px}
.t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 10px;font-weight:800;font-size:1.05rem}
.t span{font-size:.84rem;color:var(--muted);font-weight:700}
.sm{font-size:.84rem;color:var(--muted)}
.btn{border:0;border-radius:14px;font-weight:800;color:#fff;padding:14px 12px;font-size:1.02rem;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.3;text-decoration:none}
.btn small{font-weight:400;font-size:.8rem;opacity:.95}
.btn:disabled{opacity:.45}
.b-teal{background:var(--teal)}.b-blue{background:var(--blue)}.b-orange{background:var(--orange)}.b-purple{background:var(--purple)}.b-green{background:var(--green)}.b-gray{background:#eef0f3;color:var(--ink)}.b-red{background:#fff;color:#dc2626;box-shadow:inset 0 0 0 1px #fecaca}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:8px 13px;font-size:.9rem;font-weight:800;background:#eef0f3;color:#374151}
.chip.on{background:var(--teal);color:#fff}
.chip.add{background:#f0fdfa;color:var(--teal-d);box-shadow:inset 0 0 0 1px #99f6e4}
.lab{display:block;font-size:.88rem;font-weight:800;margin:14px 0 6px}
.lab:first-child{margin-top:0}
.inp{width:100%;min-width:0;padding:11px 12px;border:1px solid #d1d5db;border-radius:12px;font-size:1.05rem;background:#fff}
.inp:focus{outline:2px solid var(--teal);border-color:transparent}
textarea.inp{resize:vertical;min-height:70px}
.row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:11px 0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.t+.row,.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-size:1.02rem}
.row .main .sm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.no{font-weight:800;color:var(--teal-d);font-size:.92rem;min-width:3.6em}
.badge{border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:800;white-space:nowrap}
.st-1{background:#ede9fe;color:#6d28d9}.st0{background:#fef3c7;color:#92400e}.st1{background:#dbeafe;color:#1e40af}.st2{background:#dcfce7;color:#166534}.st3{background:#f3f4f6;color:#6b7280}
.late{color:#dc2626;font-weight:800}
.stat{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 6px;text-align:center;border:0}
.stat b{display:block;font-size:1.6rem}.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.warn{background:#fef2f2;border:1px solid #fecaca}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.item .top{display:flex;align-items:center;gap:8px}

.x{border:0;background:none;font-size:1.2rem;color:#9ca3af;padding:4px}
.price{width:7.5em;text-align:right}

.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs .ph{position:relative}.thumbs .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:.75rem}
.cam{border:1px dashed #94a3b8;background:#f8fafc;border-radius:10px;width:64px;height:64px;font-size:1.3rem}
.total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.25rem;padding:6px 2px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 2px}
.steps div{text-align:center;font-size:.74rem;word-break:keep-all;font-weight:800;padding:8px 2px;border-radius:10px;background:#f3f4f6;color:#9ca3af}
.steps div.done{background:#ccfbf1;color:var(--teal-d)}.steps div.cur{background:var(--teal);color:#fff}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:.98rem}.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
table.tb{width:100%;border-collapse:collapse;font-size:.92rem}.tb th,.tb td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.tb th:first-child,.tb td:first-child{text-align:left}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.note{font-size:.84rem;color:var(--muted);text-align:center;line-height:1.6}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.nav nav{pointer-events:auto;max-width:36rem;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 4px 18px rgb(0 0 0 / .14);display:grid;grid-template-columns:repeat(6,1fr);padding:5px}
.nav button{border:0;background:none;border-radius:14px;padding:5px 0;font-size:.7rem;white-space:nowrap;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center}
.nav button span{font-size:1.35rem;line-height:1.2}
.nav button.on{background:#ccfbf1;color:var(--teal-d)}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:60;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
.sheet{background:#fff;border-radius:20px;width:100%;max-width:36rem;max-height:92dvh;display:flex;flex-direction:column;padding:14px 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:1.08rem;color:var(--teal-d)}
.sheet-head .xx{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--muted)}
.sbody{overflow:auto;-webkit-overflow-scrolling:touch}
.pz{max-width:100%;max-height:75dvh;border-radius:12px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:12px;padding:11px 16px;font-size:.92rem;z-index:90;max-width:calc(100% - 32px);text-align:center}
.mt{margin-top:10px}
.ilab{font-size:.8rem;font-weight:800;color:#374151;margin:10px 0 0}
.flaws.m .chip.on{background:var(--teal);color:#fff}.flaws.w .chip.on{background:#ffedd5;color:#c2410c}
.cam{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.cam small{font-size:.62rem;color:var(--muted)}
.ptag{position:absolute;left:2px;bottom:2px;font-style:normal;font-size:.68rem;font-weight:800;background:#fff;border-radius:6px;padding:0 2px}
.ck{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-weight:800;margin:12px 0 6px}.ck input{width:22px;height:22px;accent-color:var(--teal)}.ck .sm{flex-basis:100%;font-weight:400;padding-left:30px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.qgrid label{font-size:.76rem;font-weight:800;color:#374151;display:flex;flex-direction:column;gap:3px}.qgrid .inp{padding:9px 8px;text-align:right}
.adv{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.84rem;line-height:1.55;color:#0c4a6e}.adv div+div{margin-top:3px}
.hit{font-size:.84rem;color:#374151;background:#f8fafc;border-radius:10px;padding:6px 10px;margin:-4px 0 6px}
mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 1px}
</style>

<body>
<main class="wrap" id="view"></main>
<div class="nav"><nav id="nav"></nav></div>
<script>
"use strict";
/* ---------- 기본 ---------- */
const KEY = "laundry-shop-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const won = n => (Number(n) || 0).toLocaleString("ko-KR") + "원";
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
const WD = "일월화수목금토";
const md = s => { if (!s) return ""; const d = new Date(s.slice(0, 10) + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
const digits = s => String(s || "").replace(/\D/g, "");
const fmtTel = s => { const d = digits(s); return d.length === 11 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}` : d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}` : s || ""; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const ST = ["접수", "세탁 중", "완료", "찾아감"];
const ST_E = ["📥", "🫧", "✅", "🙌"];
const EXP_CAT = ["세제·약제", "옷걸이·비닐", "전기·수도·가스", "월세", "인건비", "기계 수리", "특수세탁 맡김", "배달·차량", "카드 수수료", "사고 배상", "위생교육·세금", "기타"];
const FLAWS = ["구멍·찢어짐", "올 풀림", "탈색·변색", "얼룩", "단추 빠짐", "보풀", "냄새", "수선 필요"];
const METHODS = ["론드리", "웨트", "드라이", "특수"];           /* 세탁 방법별 분류 */
const M_TIP = { 론드리: "물·세제·고온", 웨트: "물로 조심스럽게", 드라이: "용제", 특수: "가죽·모피 등" };
const COLORS = ["흰색", "연한 색", "진한 색"];                  /* 색상별 분류 (이염 방지) */
const CAUTION = ["물빠짐 의심", "금속·비즈·스팽글", "가죽 트리밍", "접착심지 정장", "코팅·본딩", "오래된 폴리우레탄", "섬세한 섬유", "심한 오염"];
const DEF_PRICE = [
  ["와이셔츠", 2500, "론드리"], ["블라우스", 4000, "드라이"], ["바지", 4000, "드라이"], ["치마", 4000, "드라이"], ["니트·스웨터", 5000, "드라이"], ["원피스", 7000, "드라이"],
  ["양복 상의", 5000, "드라이"], ["양복 상하", 9000, "드라이"], ["점퍼", 8000, "웨트"], ["코트", 12000, "드라이"], ["패딩", 15000, "웨트"], ["교복 상하", 8000, "드라이"],
  ["넥타이", 3000, "드라이"], ["운동화", 6000, "특수"], ["이불", 15000, "론드리"], ["커튼(1폭)", 8000, "론드리"], ["가죽·모피", 0, "특수"], ["얼룩 빼기 추가", 3000, ""], ["수선", 0, ""],
];
const def = () => ({
  v: 1, shop: { name: "", tel: "", keep: 30, msgDone: "[{가게}] {이름}님, 맡기신 옷({옷})이 다 되었어요. 편하실 때 찾으러 오세요. 감사합니다.", msgPick: "[{가게}] {이름}님, 세탁물을 수거했어요. 가게에서 검품하고 사진과 접수증을 보내 드릴게요.", msgReady: "[{가게}] {이름}님, 세탁이 끝났어요. {배송날}에 문 앞으로 배송해 드릴게요.", msgDeliv: "[{가게}] {이름}님, 세탁물을 문 앞에 두었어요. 이용해 주셔서 감사합니다.", bank: "", acct: "", holder: "", payInDone: true, msgPay: "[{가게}] {이름}님, 세탁비 {금액}입니다.\n입금 계좌: {계좌}\n(접수번호 {번호}) 감사합니다." },
  price: DEF_PRICE.map(([k, p, m]) => ({ k, p, m })), seq: { d: "", n: 0 }, orders: [], draft: null, exp: [],
});
let S = def();
try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j) S = Object.assign(def(), j, { shop: Object.assign(def().shop, j.shop) }); } catch { }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast("저장 공간이 꽉 찼어요. 오래된 기록을 백업하고 지워 주세요"); } }
function toast(t) { document.querySelector(".toast")?.remove(); const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function modal(title, html, mount) {
  const w = document.createElement("div"); w.className = "modal";
  w.innerHTML = `<div class="sheet"><div class="sheet-head"><h3>${esc(title)}</h3><button class="xx" aria-label="닫기">×</button></div><div class="sbody">${html}</div></div>`;
  const close = () => { w.remove(); w.onclose?.(); };
  w.addEventListener("click", e => { if (e.target === w || e.target.closest(".xx")) close(); });
  document.body.appendChild(w); mount?.(w, close); return w;
}
const shopName = () => S.shop.name || "세탁소";

/* ---------- 📷 사진 (IndexedDB: 장부가 무거워지지 않게 따로 저장) ---------- */
let dbP;
const db = () => dbP ||= new Promise((ok, no) => { const r = indexedDB.open("laundry-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idb = (mode, f) => db().then(d => new Promise((ok, no) => { const tx = d.transaction("p", mode), st = tx.objectStore("p"), r = f(st); tx.oncomplete = () => ok(r?.result); tx.onerror = () => no(tx.error); }));
const putPhoto = (id, blob) => idb("readwrite", s => s.put(blob, id));
const getPhoto = id => idb("readonly", s => s.get(id));
const delPhoto = id => idb("readwrite", s => s.delete(id)).catch(() => { });
const allPhotoKeys = () => idb("readonly", s => s.getAllKeys());
const urlCache = new Map();
async function photoURL(id) { if (urlCache.has(id)) return urlCache.get(id); const b = await getPhoto(id).catch(() => null); const u = b ? URL.createObjectURL(b) : ""; urlCache.set(id, u); return u; }
function shrink(file) {   /* 긴 쪽 1200px, JPEG로 줄여서 저장 */
  return new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : no(new Error("사진")), "image/jpeg", 0.72); };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error("사진")); }; img.src = u; });
}
function pickPhoto() {
  return new Promise(ok => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.setAttribute("capture", "environment");
    i.onchange = async () => { const f = i.files?.[0]; if (!f) return ok(null); try { const b = await shrink(f), id = "p" + uid(); await putPhoto(id, b); ok(id); } catch { toast("사진을 저장하지 못했어요"); ok(null); } }; i.click(); });
}
function fillThumbs(root) { root.querySelectorAll("img[data-pid]").forEach(async im => { im.src = await photoURL(im.dataset.pid); }); }
function zoomPhoto(id) { photoURL(id).then(u => modal("📷 사진", `<img class="pz" src="${u}" alt="옷 사진">`)); }

/* ⚠️ 사고·불만 기록 (교재 10절: 유형·원인·분쟁 해결) */
function accForm(o, a, done) {
  const A = a ? JSON.parse(JSON.stringify(a)) : { id: uid(), d: today(), type: "", item: o.items[0]?.k || "", desc: "", cause: "아직 모름", how: "", amt: "", st: 0, ph: [] };
  modal(a ? "⚠️ 사고·불만 고치기" : "⚠️ 사고·불만 적기", `<div id="acB"></div>`, (m, close) => {
    const draw = () => {
      m.querySelector("#acB").innerHTML = `
      <p class="sm" style="margin:0">💡 접수증(검품 기록·사진·서명)이 가장 중요한 증거예요. 책임이 엇갈리면 한국소비자원 섬유제품심의위원회 심의를 받을 수 있고, 배상은 소비자분쟁해결기준(세탁업)을 따라요.</p>
      <label class="lab">📅 날짜</label><input class="inp" type="date" id="aD" value="${esc(A.d)}">
      <label class="lab">👕 어떤 옷</label><div class="chips">${o.items.map(it => `<button class="chip ${A.item === it.k ? "on" : ""}" data-ai="${esc(it.k)}">${esc(it.k)}</button>`).join("")}</div>

function viewBoard() {

  const cur = F.find(f => f[0] === boardF) || F[0];
  let L = O.filter(cur[2]);

  ${cur[0] === "sort" ? sortTable(L) : `<section class="card">${L.length ? L.map(o => oRow(o)).join("") : `<p class="sm" style="margin:0">해당하는 옷이 없어요.</p>`}</section>`}

/* 🧺 분류표: 접수·세탁 중인 옷을 세탁 방법 → 색으로 묶어서 (같은 통에 넣을 것끼리) */
function sortTable(L) {
  const G = {};
  for (const o of L) for (const it of o.items) { const k = `${it.m || "방법 미정"}|${it.col || "색 미정"}`; (G[k] ||= []).push({ o, it }); }
  const ord = k => { const [m, c] = k.split("|"); return (METHODS.indexOf(m) + 1 || 9) * 10 + (COLORS.indexOf(c) + 1 || 9); };
  const keys = Object.keys(G).sort((a, b) => ord(a) - ord(b));
  if (!keys.length) return `<section class="card"><p class="sm" style="margin:0">세탁할 옷이 없어요.</p></section>`;
  return `<p class="note" style="margin:0">접수·세탁 중인 옷을 세탁 방법과 색으로 묶었어요. ⚠️는 따로 조심할 옷이에요.</p>` + keys.map(k => { const [m, c] = k.split("|"), A = G[k];
    return `<section class="card"><div class="t">🧺 ${esc(m)}${M_TIP[m] ? ` <span style="font-weight:400">(${M_TIP[m]})</span>` : ""} · 🎨 ${esc(c)} <span>${A.reduce((t, x) => t + x.it.q, 0)}벌</span></div>
    ${A.map(({ o, it }) => `<button class="row" data-o="${o.id}"><span class="no">${esc(o.no)}</span><span class="main"><b>${o.rush ? "⚡ " : ""}${esc(it.k)} × ${it.q}${it.brand ? ` <span class="sm" style="display:inline">${esc(it.brand)}</span>` : ""}</b>${it.fib?.length ? `<span class="sm">🧵 ${esc(it.fib.join("·"))}${(() => { const f = it.fib.map(x => FIBER[x]).filter(v => v?.t).sort((a, b) => a.t - b.t)[0]; return f ? ` · 🔥 ${esc(f.iron)}` : ""; })()}</span>` : ""}${it.care?.length ? `<span class="sm">🏷 ${esc(it.care.join(", "))}</span>` : ""}
      ${it.caut?.length ? `<span class="sm late">⚠️ ${esc(it.caut.join(", "))}</span>` : ""}${it.flaw?.length ? `<span class="sm">흠: ${esc(it.flaw.join(", "))}</span>` : ""}</span><span class="badge st${o.st}">${ST[o.st]}</span></button>`).join("")}</section>`; }).join("");
}

function diffHtml(r) {
  const d = rowDiff(r);
  return d !== null && d !== 0 ? `<div class="late sm">⚠️ 수거 ${qn(r.in)} − 납품 ${qn(r.out)} − 재세탁·파손·분실 = ${d > 0 ? d + esc(r.u) + " 모자라요" : -d + esc(r.u) + " 많아요"}</div>` : d === 0 && qn(r.in) ? `<div class="sm" style="color:var(--teal-d)">✓ 수량 맞음</div>` : "";
}
function batText(b) {
  const c = cliById(b.cid) || {}, done = b.st === 2;
  const L = [`[${shopName()}] ${done ? "납품" : "수거"} 확인서`, `${c.name} · ${b.no}`, `수거 ${md(b.d)}${done ? ` · 납품 ${md(b.outD)}` : ` · 납품 예정 ${md(b.due)}`}`, ""];
  for (const r of b.rows.filter(r => qn(r.in) || qn(r.out))) {
    const ex = [qn(r.re) && `재세탁 ${qn(r.re)}`, qn(r.bad) && `파손 ${qn(r.bad)}`, qn(r.lost) && `분실 ${qn(r.lost)}`].filter(Boolean).join(", ");
    L.push(`■ ${r.k}: 수거 ${qn(r.in)}${r.u}${qn(r.inf) ? `(감염성 ${qn(r.inf)})` : ""}${done ? ` → 납품 ${qn(r.out)}${r.u}` : ""}${ex ? ` [${ex}]` : ""}`);
  }
  if (b.gear?.length) L.push(`■ 번호 관리: ${b.gear.map(g => g.code + (g.note ? `(${g.note})` : "")).join(", ")}`);
  L.push("", `합계 수거 ${batQty(b)} · 금액 ${won(batSum(b))}${c.vat ? " (부가세 별도)" : ""}`);
  if (b.dis && (b.dis.sep || b.dis.pre || b.dis.car)) L.push(`소독: ${[b.dis.sep && "감염성 분리", b.dis.pre && "세탁 전 소독", b.dis.car && "운반용기·적재고 소독"].filter(Boolean).join(", ")}${b.dis.at ? ` (${b.dis.at.replace("T", " ")}${b.dis.chem ? ", " + b.dis.chem : ""})` : ""}`);
  if (b.memo) L.push(`메모: ${b.memo}`);

  if (S.shop.tel) L.push(`문의 ${fmtTel(S.shop.tel)}`);

}
function viewBill(arg) {

      <p class="sm" style="margin:4px 0 0">{가게} {이름} {옷} {번호} {배송날} {금액} {계좌} 자리에 알아서 들어가요.</p>
      <label class="lab">💲 가격표 <span class="sm">(접수할 때 누르는 단추)</span></label>
      <div id="sPrice">${S.price.map((p, i) => `<div class="top" style="display:flex;gap:6px;margin-top:6px"><input class="inp" data-pk="${i}" value="${esc(p.k)}" style="flex:1"><input class="inp price" data-pp="${i}" type="number" inputmode="numeric" value="${p.p || ""}" placeholder="0"><button class="x" data-pdel="${i}" aria-label="빼기">✕</button></div>
      <div class="chips" style="margin:4px 0 6px">${METHODS.map(m => `<button class="chip ${p.m === m ? "on" : ""}" data-pm="${i}" data-mv="${m}" style="padding:4px 10px;font-size:.78rem">${m}</button>`).join("")}</div>`).join("")}</div>
      <div class="g2 mt"><button class="btn b-gray" id="sAdd">＋ 옷 종류 추가</button><button class="btn b-gray" id="sDef">↺ 기본 가격표로</button></div>
      <p class="sm">가격을 0으로 두면 접수할 때 직접 적어요 (예: 가죽, 수선). 아래 단추는 그 옷의 기본 세탁 방법이에요.</p>
      <label class="lab">💾 백업 (휴대폰을 바꾸거나 고장 날 때를 대비)</label>
      <button class="btn b-teal" id="sBk">💾 백업 파일 만들기<small>사진 포함 · 카톡이나 파일에 저장</small></button>
      <button class="btn b-gray mt" id="sLoad">📂 백업 불러오기</button>
      <p class="sm">장부는 이 휴대폰의 이 브라우저에만 저장돼요. 손님 전화번호가 들어 있으니 백업 파일은 남에게 보내지 마세요.</p>
      <button class="btn b-red mt" id="sReset">🗑 장부 모두 지우기</button>`;
      const B = m.querySelector("#setB");
      B.querySelector("#sName").oninput = e => { S.shop.name = e.target.value.trim(); save(); };
      B.querySelector("#sEdu").onchange = e => { S.shop.edu = e.target.value; save(); };
      B.querySelector("#sTel").onchange = e => { S.shop.tel = fmtTel(e.target.value); e.target.value = S.shop.tel; save(); };
      B.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => { S.shop.keep = +b.dataset.keep; save(); draw(); });
      B.querySelector("#sBank").oninput = e => { S.shop.bank = e.target.value.trim(); save(); };
      B.querySelector("#sHolder").oninput = e => { S.shop.holder = e.target.value.trim(); save(); };
      B.querySelector("#sAcct").oninput = e => { S.shop.acct = e.target.value.trim(); save(); };
      B.querySelector("#sPayIn").onchange = e => { S.shop.payInDone = e.target.checked; save(); };
      B.querySelector("#sMsgPay").oninput = e => { S.shop.msgPay = e.target.value; save(); };
      B.querySelector("#sMsg").oninput = e => { S.shop.msgDone = e.target.value; save(); };
      B.querySelector("#sMsgP").oninput = e => { S.shop.msgPick = e.target.value; save(); };
      B.querySelector("#sMsgR").oninput = e => { S.shop.msgReady = e.target.value; save(); };
      B.querySelector("#sMsgD").oninput = e => { S.shop.msgDeliv = e.target.value; save(); };
      B.querySelectorAll("[data-pk]").forEach(x => x.oninput = e => { S.price[+x.dataset.pk].k = e.target.value; save(); });
      B.querySelectorAll("[data-pp]").forEach(x => x.oninput = e => { S.price[+x.dataset.pp].p = Number(e.target.value) || 0; save(); });
      B.querySelectorAll("[data-pm]").forEach(x => x.onclick = () => { const p = S.price[+x.dataset.pm]; p.m = p.m === x.dataset.mv ? "" : x.dataset.mv; save(); draw(); });
      B.querySelectorAll("[data-pdel]").forEach(x => x.onclick = () => { S.price.splice(+x.dataset.pdel, 1); save(); draw(); });
      B.querySelector("#sAdd").onclick = () => { S.price.push({ k: "새 옷", p: 0 }); save(); draw(); B.querySelector(`[data-pk="${S.price.length - 1}"]`)?.select(); };
      B.querySelector("#sDef").onclick = () => { if (confirm("가격표를 처음 기본값으로 되돌릴까요?")) { S.price = def().price; save(); draw(); } };
      B.querySelector("#sBk").onclick = backup;
      B.querySelector("#sLoad").onclick = () => restore(() => { close(); go("home"); });
      B.querySelector("#sReset").onclick = async () => { if (!confirm("접수 기록, 손님, 지출, 거래처 회차·정산 기록, 사진을 모두 지울까요?\n(가게 정보, 가격표, 거래처 목록은 남아요)")) return; if (!confirm("정말 지울까요? 백업이 없으면 되돌릴 수 없어요.")) return;
        for (const k of await allPhotoKeys().catch(() => [])) await delPhoto(k); S.orders = []; S.exp = []; S.bat = []; S.billSt = {}; S.draft = null; S.seq = { d: "", n: 0 }; save(); close(); go("home"); toast("모두 지웠어요"); };
    };
    m.onclose = () => go(tab, tabArg);
    draw();
  });
}
const b64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
async function backup() {
  toast("백업 파일 만드는 중…");
  const ph = {}, ids = [...S.orders.flatMap(orderPh), ...(S.bat || []).flatMap(batPh), ...(S.exp || []).flatMap(e => e.ph || [])];
  for (const id of ids) { const b = await getPhoto(id).catch(() => null); if (b) ph[id] = await b64(b); }
  const name = `세탁소장부_${today()}.json`;
  const file = new File([JSON.stringify({ app: "laundry-shop", savedAt: new Date().toISOString(), data: S, photos: ph })], name, { type: "application/json" });
  S.lastBk = new Date().toISOString(); save();
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: "세탁소 장부 백업" }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; a.click(); toast("백업 파일을 저장했어요");
}
function restore(done) {
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => { const f = i.files?.[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (j.app !== "laundry-shop" || !j.data) throw 0;
      if (!confirm(`${md(j.savedAt)} 백업 (접수 ${j.data.orders?.length || 0}건)을 불러올까요?\n지금 장부는 백업 내용으로 바뀌어요.`)) return;
      for (const [id, u] of Object.entries(j.photos || {})) await putPhoto(id, await (await fetch(u)).blob());
      S = Object.assign(def(), j.data, { shop: Object.assign(def().shop, j.data.shop) }); save(); urlCache.clear(); toast("불러왔어요"); done();
    } catch { toast("세탁소 장부 백업 파일이 아니에요"); } };
  i.click();
}

go("home");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
</script>
</body>
</html>
